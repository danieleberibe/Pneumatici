[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stereolab"
version = "0.1.0"
description = "Stereo vision laboratory for calibrated 3D ball localization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=2.1,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
https = ["cryptography>=44,<50"]

[tool.setuptools.packages.find]
include = ["stereolab*"]

[tool.setuptools.package-data]
stereolab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

